[package]
name = "nullsound"
version = "1.0.0"
edition = "2024"
description = "NullSound - native Rust Android music player"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[build-dependencies]
slint-build = "1.18.1"

[package.metadata.android]
package = "com.notkrishenough.nullsound"
label = "NullSound"
min_sdk_version = 26
target_sdk_version = 35
