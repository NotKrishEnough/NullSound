name: Android CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: |
          flutter create --platforms=android --project-name nullsound --org com.nke.nullsound .
          rm -rf test

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        shell: bash
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo 'No test/ directory yet; skipping Flutter tests.'
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK and changelog
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NullSound-${GITHUB_REF_NAME}.apk
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:'- %s (%h)' "$PREVIOUS_TAG".." ${GITHUB_REF_NAME}" > dist/CHANGELOG.md
            else
              git log -10 --pretty=format:'- %s (%h)' > dist/CHANGELOG.md
            fi
          else
            git log -10 --pretty=format:'- %s (%h)' > dist/CHANGELOG.md
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullSound-Android-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/CHANGELOG.md
          body_path: dist/CHANGELOG.md
          generate_release_notes: true
