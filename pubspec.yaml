name: nullsound
description: A modern, Android-first Flutter music player.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  youtube_explode_dart: ^3.0.5
  dynamic_color: ^1.7.0
  palette_generator: ^0.3.3+7
  cached_network_image: ^3.4.1
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  http: ^1.3.0
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  lyrics_parser: ^1.0.1
  permission_handler: ^12.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
